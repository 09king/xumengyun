<style>

<script>
(() => {
  'use strict';

  // 修改这里即可切换年份（默认下一个元旦）
  const YEAR = '2027';
  const LOOP = 48000;

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;
  let start = performance.now();
  let stars = [], clouds = [], particles = [], bubbles = [], bursts = [], river = [];
  let grainPattern = null;
  let audio = null, userDisabledMusic = false, gestureDone = false;
  const musicMarkers = [
    { t: 6000, f: 523.25 }, { t: 16000, f: 659.25 },
    { t: 24000, f: 783.99 }, { t: 28000, f: 1046.5 },
    { t: 37500, f: 880 }
  ];
  const musicBtn = document.getElementById('music');
  let mouse = { x: 0, y: 0 }, pmouse = { x: 0, y: 0 };

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const windowAt = (t, a, b, c, d) => clamp((t - a) / (b - a)) * (1 - clamp((t - c) / (d - c)));
  const bezier = (a, b, c, d, u) => {
    const v = 1 - u;
    return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d;
  };

  // 叙事线：一叶纸船的追梦旅程（以物件为主角，不出现人名）
  const chapters = [
    { from: 0, to: 8000, label: '一 · 夜航' },
    { from: 8000, to: 16000, label: '二 · 风起' },
    { from: 16000, to: 24000, label: '三 · 逐光' },
    { from: 24000, to: 28000, label: '四 · 穿门' },
    { from: 28000, to: 38000, label: '五 · 梦成' },
    { from: 38000, to: 48000, label: '六 · 启航' }
  ];

  function boatPos(t) {
    const cx = W / 2, cy = H * .43, base = Math.min(W, H);
    if (t < 8000) {
      const p = clamp(t / 8000);
      return {
        x: lerp(W * .82, W * .62, p),
        y: lerp(H * .74, H * .67, p) + Math.sin(t / 900) * 5,
        s: 1, a: clamp(t / 1400), r: Math.sin(t / 1300) * .035
      };
    }
    if (t < 16000) {
      const p = easeInOut(clamp((t - 8000) / 8000));
      return {
        x: lerp(W * .62, W * .54, p),
        y: lerp(H * .67, H * .56, p) + Math.sin(t / 800) * 4,
        s: 1 + .12 * p, a: 1, r: Math.sin(t / 1100) * .06
      };
    }
    if (t < 24000) {
      const p = easeInOut(clamp((t - 16000) / 8000));
      return {
        x: lerp(W * .54, cx, p),
        y: lerp(H * .56, cy, p) + Math.sin(t / 700) * 3,
        s: 1.12 + .3 * p, a: 1, r: lerp(.06, 0, p)
      };
    }
    if (t < 27000) {
      const p = clamp((t - 24000) / 3000);
      return { x: cx, y: cy, s: 1.42 + p * .8, a: 1 - p, r: 0 };
    }
    if (t < 37500) {
      const ang = (t - 27000) / 10500 * Math.PI * 2 - Math.PI / 2;
      const r = base * .4;
      return {
        x: cx + Math.cos(ang) * r * 1.25,
        y: cy + Math.sin(ang) * r * .62,
        s: .85, a: .34, r: ang * .06
      };
    }
    if (t < 48000) {
      const p = clamp((t - 37500) / 10500);
      const yStart = cy - base * .4 * .62;
      return {
        x: lerp(cx, W * .86, easeInOut(p)),
        y: lerp(yStart, H * .71, p) + Math.sin(t / 700) * 4,
        s: lerp(.85, .72, p),
        a: clamp((48000 - t) / 3500),
        r: Math.sin(t / 900) * .05
      };
    }
    return { x: cx, y: cy, s: 1, a: 0, r: 0 };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
    buildGrain();
  }

  function buildGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const img = g.createImageData(128, 128);
    for (let i = 0; i < 128 * 128; i++) {
      const v = 120 + Math.random() * 135;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 20;
    }
    g.putImageData(img, 0, 0);
    grainPattern = ctx.createPattern(c, 'repeat');
  }

  // 用径向渐变堆叠出柔和的“体积云”贴图
  function makeCloudSprite(w, h, palette, seed) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    let s = seed >>> 0;
    const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < 56; i++) {
      const px = w * (.1 + rnd() * .8);
      const py = h * (.26 + rnd() * .56);
      const r = h * (.12 + rnd() * .28);
      const col = palette[Math.floor(rnd() * palette.length)];
      const grad = g.createRadialGradient(px, py, 0, px, py, r);
      grad.addColorStop(0, col.replace('A', '.36'));
      grad.addColorStop(.55, col.replace('A', '.14'));
      grad.addColorStop(1, col.replace('A', '0'));
      g.fillStyle = grad;
      g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.fill();
    }
    return c;
  }

  function buildScene() {
    stars = [];
    const starCount = Math.round(clamp(W * H / 8000, 110, 300));
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: rand(0, W), y: rand(0, H * .9),
        r: rand(.4, 1.8), phase: rand(0, Math.PI * 2),
        speed: rand(.5, 2.2), hue: Math.random() < .22 ? '255,214,190' : '226,234,255'
      });
    }

    const palettes = [
      ['rgba(168,160,255,A)', 'rgba(120,130,220,A)', 'rgba(238,190,255,A)'],
      ['rgba(255,186,214,A)', 'rgba(196,150,226,A)', 'rgba(255,224,206,A)'],
      ['rgba(150,206,255,A)', 'rgba(188,178,255,A)', 'rgba(255,255,255,A)']
    ];
    const sprites = palettes.map((p, i) => makeCloudSprite(600, 260, p, 1234 + i * 977));
    clouds = [];
    const count = reduceMotion ? 7 : 13;
    for (let i = 0; i < count; i++) {
      const depth = i / count;
      const scale = rand(.65, 1.8) * (.6 + depth * .75);
      clouds.push({
        sprite: sprites[i % sprites.length],
        x: rand(-W * .25, W * 1.15),
        y: H * (depth * .76 + .1) + rand(-48, 48),
        w: 600 * scale, h: 260 * scale,
        speed: rand(3, 17) * (i % 3 === 0 ? -1 : 1),
        alpha: rand(.32, .82) * (.55 + depth * .45),
        wave: rand(0, Math.PI * 2),
        depth
      });
    }

    buildParticles();

    bubbles = [];
    const kinds = ['moon', 'boat', 'star', 'key', 'feather', 'clock', 'star', 'moon'];
    const n = reduceMotion ? 4 : 8;
    for (let i = 0; i < n; i++) {
      bubbles.push({
        kind: kinds[i % kinds.length],
        r: rand(18, 32),
        phase: rand(0, Math.PI * 2),
        dir: i % 2 ? 1 : -1,
        orbit: rand(.33, .48),
        alpha: rand(.55, .95)
      });
    }

    river = [];
    const colors = ['255,232,200', '210,225,255', '255,200,230'];
    for (let i = 0; i < (reduceMotion ? 60 : 180); i++) {
      river.push({
        phase: Math.random(), speed: rand(.07, .18),
        r: rand(.7, 2.1), c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  // 采样文字像素，作为粒子的汇聚目标
  function buildParticles() {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const o = off.getContext('2d');
    const fontSize = Math.min(W * (YEAR.length > 4 ? .2 : .27), H * .38, 380);
    o.font = `900 ${fontSize}px "Arial Black","Helvetica Neue",Arial,sans-serif`;
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    o.fillStyle = '#fff';
    o.fillText(YEAR, W / 2, H * .43);

    const data = o.getImageData(0, 0, W, H).data;
    const step = Math.max(3, Math.round(fontSize / 64));
    const pts = [];
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        if (data[(y * W + x) * 4 + 3] > 110) pts.push({ x, y });
      }
    }
    const max = reduceMotion ? 700 : 1700;
    while (pts.length > max) pts.splice(Math.floor(Math.random() * pts.length), 1);

    particles = pts.map(p => ({
      tx: p.x, ty: p.y,
      angle: rand(0, Math.PI * 2),
      orbitR: rand(.16, 1.1),
      spin: rand(-.9, .9),
      size: rand(.8, 2.3),
      delay: rand(0, 900),
      driftX: rand(-160, 160), driftY: rand(-620, -180),
      phase: rand(0, Math.PI * 2),
      warm: Math.random() < .38
    }));
  }

  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05081c');
    g.addColorStop(.42, '#17153d');
    g.addColorStop(.74, '#3c255e');
    g.addColorStop(1, '#8a5178');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const warmth = windowAt(t, 6200, 13000, 39000, 46000);
    const pulse = .9 + Math.sin(t / 2400) * .1;
    const glow = ctx.createRadialGradient(W / 2, H * .82, 0, W / 2, H * .82, W * .68);
    glow.addColorStop(0, `rgba(255,190,160,${(.16 + .22 * warmth) * pulse})`);
    glow.addColorStop(.45, `rgba(215,140,200,${(.07 + .08 * warmth) * pulse})`);
    glow.addColorStop(1, 'rgba(120,80,180,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const band = ctx.createLinearGradient(0, H * .2, W, H * .62);
    band.addColorStop(0, 'rgba(90,120,255,0)');
    band.addColorStop(.5, `rgba(140,110,240,${.07 + .05 * warmth + .02 * Math.sin(t / 3200)})`);
    band.addColorStop(1, 'rgba(255,140,190,0)');
    ctx.fillStyle = band;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawStars(t) {
    const brightness = 1 - .45 * windowAt(t, 6500, 12000, 39000, 45000);
    for (const s of stars) {
      const a = (.22 + .78 * (.5 + .5 * Math.sin(t / 1000 * s.speed + s.phase))) * brightness;
      ctx.fillStyle = `rgba(${s.hue},${a * .92})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      if (s.r > 1.35 && a > .8) {
        ctx.strokeStyle = `rgba(${s.hue},${(a - .8) * 1.5})`;
        ctx.lineWidth = .6;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 4, s.y); ctx.lineTo(s.x + s.r * 4, s.y);
        ctx.moveTo(s.x, s.y - s.r * 4); ctx.lineTo(s.x, s.y + s.r * 4);
        ctx.stroke();
      }
    }
  }

  function drawClouds(t, dt, layer) {
    for (const c of clouds) {
      if ((layer === 'far') !== (c.depth < .55)) continue;
      c.x += c.speed * dt;
      if (c.x > W + c.w) c.x = -c.w;
      if (c.x < -c.w * 2) c.x = W + c.w;
      const float = Math.sin(t / 2800 + c.wave) * 9;
      const px = pmouse.x * (8 + c.depth * 28);
      const py = pmouse.y * (4 + c.depth * 16);
      ctx.globalAlpha = c.alpha * clamp(t / 2600);
      ctx.drawImage(c.sprite, c.x + px, c.y + float + py, c.w, c.h);
    }
    ctx.globalAlpha = 1;
  }

  function drawMeteor(t, offset) {
    const cycle = (t + offset) % 11000;
    if (cycle > 1400) return;
    const p = cycle / 1400;
    const x = W * (.08 + p * .6);
    const y = H * (.06 + p * .34);
    const len = 110;
    const g = ctx.createLinearGradient(x - len, y - len * .55, x, y);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(255,246,230,.88)');
    ctx.strokeStyle = g; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x - len, y - len * .55); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,250,240,.92)';
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
  }

  function drawGodRays(t) {
    const a = clamp(windowAt(t, 6200, 8800, 14200, 17000)
      + .4 * windowAt(t, 25500, 28500, 37000, 41000));
    if (a <= 0) return;
    const cx = W / 2, cy = H * .84;
    const len = Math.max(W, H) * 1.05;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 15; i++) {
      const ang = -Math.PI / 2 + (i - 7) * .085 + Math.sin(t / 4600 + i) * .035;
      const spread = .028 + .018 * Math.sin(t / 3100 + i * 1.7);
      const x1 = cx + Math.cos(ang - spread) * len;
      const y1 = cy + Math.sin(ang - spread) * len;
      const x2 = cx + Math.cos(ang + spread) * len;
      const y2 = cy + Math.sin(ang + spread) * len;
      const g = ctx.createLinearGradient(cx, cy, x1, y1);
      g.addColorStop(0, `rgba(255,216,186,${.085 * a})`);
      g.addColorStop(1, 'rgba(255,180,220,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawLensFlare(t) {
    let a = 0;
    if (t > 7500 && t < 14000) a = Math.sin(Math.PI * (t - 7500) / 6500);
    else if (t > 26500 && t < 32500) a = .55 * Math.sin(Math.PI * (t - 26500) / 6000);
    if (a <= 0) return;
    const sx = W / 2, sy = H * .8;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const spots = [
      [0, 0, 90, '255,220,190', .15], [-.18, -.2, 20, '180,210,255', .22],
      [.23, -.32, 30, '255,190,220', .17], [-.4, -.52, 13, '255,255,255', .26],
      [.48, -.64, 24, '190,180,255', .13]
    ];
    for (const [ox, oy, r, c, al] of spots) {
      const x = sx + ox * W, y = sy + oy * H;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${c},${al * a})`);
      g.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    const streak = ctx.createLinearGradient(sx - W * .5, sy, sx + W * .5, sy);
    streak.addColorStop(0, 'rgba(255,220,190,0)');
    streak.addColorStop(.5, `rgba(255,235,210,${.1 * a})`);
    streak.addColorStop(1, 'rgba(255,220,190,0)');
    ctx.fillStyle = streak;
    ctx.fillRect(sx - W * .5, sy - 1, W, 2);
    ctx.restore();
  }

  // 梦境之门：多层旋转星环
  function drawPortal(t) {
    const a = windowAt(t, 13000, 15500, 22000, 24500);
    if (a <= 0) return;
    const cx = W / 2, cy = H * .43;
    const base = Math.min(W, H) * .19;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * 2.2);
    halo.addColorStop(0, `rgba(190,180,255,${.16 * a})`);
    halo.addColorStop(1, 'rgba(190,180,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, base * 2.2, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 4; i++) {
      const r = base * (.62 + i * .34) * (1 + .12 * Math.sin(t / 1600 + i));
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t / (5200 + i * 1400) * (i % 2 ? -1 : 1));
      ctx.strokeStyle = `rgba(${i % 2 ? '255,214,200' : '200,220,255'},${(.5 - i * .08) * a})`;
      ctx.lineWidth = i === 0 ? 1.8 : 1.1;
      ctx.setLineDash([8 + i * 5, 14 + i * 9]);
      ctx.lineDashOffset = -t / 90;
      ctx.beginPath(); ctx.ellipse(0, 0, r, r * .62, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    for (let i = 0; i < 30; i++) {
      const ang = i / 30 * Math.PI * 2 + t / 3400;
      const r = base * (1.4 + .12 * Math.sin(t / 900 + i));
      const x = cx + Math.cos(ang) * r;
      const y = cy + Math.sin(ang) * r * .62;
      ctx.fillStyle = `rgba(255,244,230,${(.3 + .5 * Math.abs(Math.sin(t / 700 + i))) * a})`;
      ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawRiver(t) {
    const a = windowAt(t, 37000, 39800, 43800, 46500);
    if (a <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const d of river) {
      const prog = (t / 1000 * d.speed + d.phase) % 1;
      const y = H * (1.08 - prog * 1.22);
      const spread = (1 - prog) * W * .2 + 16;
      const x = W / 2 + Math.sin(d.phase * 24 + prog * 7) * spread;
      ctx.fillStyle = `rgba(${d.c},${a * (1 - prog) * .8})`;
      ctx.beginPath(); ctx.arc(x, y, d.r * (1 - prog * .4), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles(t) {
    const alpha = windowAt(t, 15800, 18200, 37200, 41800);
    if (alpha <= 0) return;
    const converge = clamp((t - 22000) / 4100);
    const scatter = clamp((t - 37200) / 4300);
    const shrink = 1 - .32 * clamp((t - 13000) / 9000);
    const base = Math.min(W, H);
    const cx = W / 2, cy = H * .43;

    if (converge > .55 && scatter === 0) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * .46);
      g.addColorStop(0, `rgba(255,226,196,${.18 * alpha * (converge - .55) / .45})`);
      g.addColorStop(1, 'rgba(255,200,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const ang = p.angle + t / 1000 * p.spin;
      const r = base * p.orbitR * shrink;
      const ox = cx + Math.cos(ang) * r * 1.22;
      const oy = cy + Math.sin(ang) * r * .55;
      const local = easeOut(clamp((t - 22000 - p.delay) / 3300));
      const jitter = (1 - local) * 10;
      let x = ox + (p.tx - ox) * local + Math.sin(t / 420 + p.phase) * jitter;
      let y = oy + (p.ty - oy) * local + Math.cos(t / 380 + p.phase) * jitter;
      if (scatter > 0) {
        x += p.driftX * scatter + Math.sin(t / 600 + p.phase) * 18 * scatter;
        y += p.driftY * scatter * scatter;
      }
      const twinkle = .72 + .28 * Math.sin(t / 300 + p.phase);
      ctx.fillStyle = p.warm
        ? `rgba(255,226,190,${alpha * twinkle})`
        : `rgba(226,236,255,${alpha * twinkle})`;
      ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawIcon(kind, r) {
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    switch (kind) {
      case 'moon':
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI * .32, Math.PI * 1.68);
        ctx.arc(r * .42, -r * .1, r * .92, Math.PI * 1.55, Math.PI * .55, true);
        ctx.stroke();
        break;
      case 'boat':
        ctx.beginPath();
        ctx.moveTo(-r, r * .15); ctx.lineTo(r, r * .15);
        ctx.lineTo(r * .55, r * .62); ctx.lineTo(-r * .55, r * .62); ctx.closePath();
        ctx.moveTo(0, -r * .7); ctx.lineTo(-r * .72, r * .12);
        ctx.moveTo(0, -r * .7); ctx.lineTo(r * .72, r * .12);
        ctx.stroke();
        break;
      case 'star': {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const rr = i % 2 ? r * .44 : r;
          const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath(); ctx.stroke();
        break;
      }
      case 'key':
        ctx.beginPath(); ctx.arc(-r * .35, -r * .3, r * .4, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-r * .06, -r * .02); ctx.lineTo(r * .78, r * .76); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r * .42, r * .4); ctx.lineTo(r * .62, r * .2);
        ctx.moveTo(r * .62, r * .6); ctx.lineTo(r * .8, r * .42); ctx.stroke();
        break;
      case 'feather':
        ctx.beginPath();
        ctx.moveTo(-r * .55, r * .75);
        ctx.quadraticCurveTo(r * .1, -r * .2, r * .65, -r * .72);
        ctx.quadraticCurveTo(r * .3, r * .05, -r * .55, r * .75);
        ctx.moveTo(-r * .35, r * .45); ctx.lineTo(r * .45, -r * .5);
        ctx.stroke();
        break;
      case 'clock':
        ctx.beginPath(); ctx.arc(0, 0, r * .85, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -r * .5);
        ctx.moveTo(0, 0); ctx.lineTo(r * .42, r * .18); ctx.stroke();
        break;
    }
  }

  // 引导纸船驶向星环的光轨
  function drawLightPath(t) {
    const a = windowAt(t, 12500, 15800, 23000, 25800);
    if (a <= 0) return;
    const cx = W / 2, cy = H * .43;
    const p0 = [W * .08, H * .8], p1 = [W * .26, H * .64];
    const p2 = [W * .33, H * .48], p3 = [cx, cy];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,224,190,${.24 * a})`;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 12]);
    ctx.lineDashOffset = -t / 55;
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.bezierCurveTo(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]);
    ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < 9; i++) {
      const u = (t / 2800 + i / 9) % 1;
      const x = bezier(p0[0], p1[0], p2[0], p3[0], u);
      const y = bezier(p0[1], p1[1], p2[1], p3[1], u);
      ctx.fillStyle = `rgba(255,240,210,${a * (1 - u) * .7})`;
      ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 纸船：故事的视线焦点，船心的一点梦之光最终化为年份
  function drawBoat(t) {
    const pos = boatPos(t);
    if (pos.a <= 0) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i <= 16; i++) {
      const q = boatPos(Math.max(0, t - i * 110));
      const a = pos.a * (1 - i / 17) * .45;
      ctx.fillStyle = `rgba(255,226,186,${a})`;
      ctx.beginPath();
      ctx.arc(q.x, q.y - 8 * q.s, Math.max(.4, 1.6 * (1 - i / 20)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(pos.r);
    ctx.scale(pos.s, pos.s);
    ctx.globalAlpha = pos.a;

    const glow = ctx.createRadialGradient(0, -2, 2, 0, -2, 48);
    glow.addColorStop(0, 'rgba(255,226,180,.3)');
    glow.addColorStop(1, 'rgba(255,200,180,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, -2, 48, 0, Math.PI * 2); ctx.fill();

    ctx.shadowColor = 'rgba(255,220,190,.9)';
    ctx.shadowBlur = 18;
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.fillStyle = 'rgba(255,248,236,.93)';
    ctx.beginPath();
    ctx.moveTo(-26, 2); ctx.lineTo(26, 2);
    ctx.lineTo(17, 14); ctx.lineTo(-17, 14); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(238,236,255,.88)';
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(-24, 2); ctx.lineTo(24, 2); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,232,180,.98)';
    ctx.beginPath(); ctx.arc(0, -4, 3 + Math.sin(t / 220) * .8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (t > 24000 && t < 26500) {
      const p = clamp((t - 24000) / 2500);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = `rgba(255,220,190,${(1 - p) * (.4 - i * .1)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, 20 + p * 90 + i * 22, 10 + p * 45 + i * 11, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 章节小字：强化故事节奏
  function drawChapter(t) {
    let label = '', alpha = 0;
    for (const c of chapters) {
      if (t >= c.from && t < c.to) {
        label = c.label;
        alpha = clamp((t - c.from) / 900) * (1 - clamp((c.to - t) / 900));
        break;
      }
    }
    if (!label || alpha <= 0) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = `rgba(248,244,255,${.52 * alpha})`;
    ctx.shadowColor = 'rgba(180,200,255,.7)';
    ctx.shadowBlur = 8;
    ctx.fillText(label, W / 2, H - 86);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(248,244,255,${.26 * alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 18, H - 66);
    ctx.lineTo(W / 2 + 18, H - 66);
    ctx.stroke();
    ctx.restore();
  }

  function drawBubbles(t) {
    const visible = windowAt(t, 27500, 29500, 40800, 42800);
    if (visible <= 0) return;
    const base = Math.min(W, H);
    const cx = W / 2, cy = H * .43;
    ctx.save();
    for (const b of bubbles) {
      const ang = b.phase + t / 11000 * Math.PI * 2 * b.dir;
      const r = base * (b.orbit + .035 * Math.sin(t / 2600 + b.phase));
      const rise = (t - 27500) / 1000 * 5;
      const x = cx + Math.cos(ang) * r * 1.25;
      const y = cy + Math.sin(ang) * r * .68 - rise;
      const a = b.alpha * visible;
      if (a <= 0 || y < -60 || y > H + 60) continue;

      const g = ctx.createRadialGradient(x - b.r * .3, y - b.r * .35, 1, x, y, b.r * 1.5);
      g.addColorStop(0, `rgba(255,255,255,${.16 * a})`);
      g.addColorStop(.65, `rgba(190,200,255,${.06 * a})`);
      g.addColorStop(1, 'rgba(190,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, b.r * 1.5, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = `rgba(232,240,255,${.26 * a})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, b.r * 1.25, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = `rgba(255,255,255,${.82 * a})`;
      ctx.shadowColor = 'rgba(150,200,255,.9)';
      ctx.shadowBlur = 12;
      ctx.save();
      ctx.translate(x, y);
      drawIcon(b.kind, b.r * .5);
      ctx.restore();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function spawnBurst(x, y) {
    const colors = ['255,232,200', '210,225,255', '255,200,230'];
    for (let i = 0; i < 46; i++) {
      const a = rand(0, Math.PI * 2), v = rand(40, 230);
      bursts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0, max: rand(.8, 1.6), r: rand(.8, 2.4),
        c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    if (bursts.length > 400) bursts.splice(0, bursts.length - 400);
  }

  function drawBursts(dt) {
    if (!bursts.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    bursts = bursts.filter(b => {
      b.life += dt;
      if (b.life > b.max) return false;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= .975; b.vy = b.vy * .975 + 16 * dt;
      const a = 1 - b.life / b.max;
      ctx.fillStyle = `rgba(${b.c},${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      return true;
    });
    ctx.restore();
  }

  // 分镜运镜：俯冲入云 → 横移 → 推近 → 拉远 → 回落
  function camera(t) {
    const keys = [
      [0, 6000, 1.24, 1.0, 0, 0, .1, 0],
      [6000, 22000, 1.0, 1.06, 0, -.025, 0, 0],
      [22000, 32000, 1.06, 1.15, -.025, 0, 0, 0],
      [32000, 40000, 1.15, 1.02, 0, 0, 0, 0],
      [40000, 48000, 1.02, 1.09, 0, 0, 0, .04]
    ];
    let z = 1, dx = 0, dy = 0;
    for (const [a, b, z1, z2, x1, x2, y1, y2] of keys) {
      if (t >= a && t < b) {
        const p = easeInOut(clamp((t - a) / (b - a)));
        z = lerp(z1, z2, p);
        dx = W * lerp(x1, x2, p);
        dy = H * lerp(y1, y2, p);
        break;
      }
      if (t >= b) { z = z2; dx = W * x2; dy = H * y2; }
    }
    if (reduceMotion) { z = 1; dx = 0; dy = 0; }
    const shake = windowAt(t, 22000, 22600, 25000, 25800) * 2.2;
    return { z, x: dx + rand(-shake, shake), y: dy + rand(-shake, shake) };
  }

  // ===== 程序化背景音乐（Web Audio，无外部音频文件）=====
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const chords = [
    [50, 57, 60, 65], // Dm7
    [46, 53, 57, 62], // Bbmaj7
    [53, 60, 64, 69], // Fmaj7
    [48, 55, 59, 64]  // Cmaj7
  ];

  function initAudio() {
    if (audio) return audio;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ac = new AC();

    const master = ac.createGain();
    master.gain.value = 0;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 22;
    comp.ratio.value = 4;
    comp.attack.value = .01;
    comp.release.value = .3;
    master.connect(comp);
    comp.connect(ac.destination);

    const conv = ac.createConvolver();
    const len = Math.floor(ac.sampleRate * 2.6);
    const impulse = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
    }
    conv.buffer = impulse;
    const wet = ac.createGain();
    wet.gain.value = .34;
    conv.connect(wet);
    wet.connect(master);

    const padFilter = ac.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 820;
    const padGain = ac.createGain();
    padGain.gain.value = .13;
    padGain.connect(padFilter);
    padFilter.connect(master);
    padFilter.connect(conv);

    const voices = [];
    for (let i = 0; i < 4; i++) {
      const o = ac.createOscillator();
      o.type = i % 2 ? 'sine' : 'triangle';
      o.frequency.value = midi(chords[0][i]);
      const g = ac.createGain();
      g.gain.value = .2;
      o.connect(g); g.connect(padGain);
      o.start();
      voices.push({ o, g });
    }
    const lfo = ac.createOscillator();
    lfo.frequency.value = .08;
    const lfoGain = ac.createGain();
    lfoGain.gain.value = .035;
    lfo.connect(lfoGain); lfoGain.connect(padGain.gain);
    lfo.start();

    const noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource();
    noise.buffer = noiseBuf; noise.loop = true;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 680; bp.Q.value = .55;
    const noiseGain = ac.createGain();
    noiseGain.gain.value = 0;
    noise.connect(bp); bp.connect(noiseGain);
    noiseGain.connect(master); noiseGain.connect(conv);
    noise.start();

    audio = {
      ac, master, conv, voices, noiseGain, padFilter, noiseBuf,
      enabled: false, chordIndex: -1, chordNotes: chords[0], styleB: false,
      markers: new Set(), arpTimer: null, nextNote: 0, step: 0
    };
    return audio;
  }

  function setChord(a, idx) {
    a.chordIndex = idx;
    a.chordNotes = chords[idx];
    a.voices.forEach((v, i) => {
      v.o.frequency.setTargetAtTime(midi(a.chordNotes[i]), a.ac.currentTime, .7);
    });
  }

  function playNote(a, freq, when, level, decay, type, panValue) {
    const o = a.ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const g = a.ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(level, when + .015);
    g.gain.exponentialRampToValueAtTime(.0001, when + decay);
    o.connect(g);
    if (a.ac.createStereoPanner) {
      const pan = a.ac.createStereoPanner();
      pan.pan.value = panValue === undefined ? (a.step % 2 ? .32 : -.32) : panValue;
      g.connect(pan); pan.connect(a.master); pan.connect(a.conv);
    } else {
      g.connect(a.master); g.connect(a.conv);
    }
    o.start(when);
    o.stop(when + decay + .05);
  }

  function playChime(a, freq, when, bright) {
    const o = a.ac.createOscillator();
    o.type = 'sine'; o.frequency.value = freq;
    const o2 = a.ac.createOscillator();
    o2.type = 'triangle'; o2.frequency.value = bright ? freq * 1.5 : freq * 2.01;
    const g = a.ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(bright ? .17 : .15, when + (bright ? .008 : .02));
    g.gain.exponentialRampToValueAtTime(.0001, when + (bright ? 1.9 : 2.6));
    const g2 = a.ac.createGain();
    g2.gain.value = bright ? .3 : .22;
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(a.master); g.connect(a.conv);
    o.start(when); o2.start(when);
    o.stop(when + 2.7); o2.stop(when + 2.7);
  }

  // 第二段风格的轻沙锤
  function playShaker(a, when) {
    const src = a.ac.createBufferSource();
    src.buffer = a.noiseBuf;
    const hp = a.ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 4200;
    const g = a.ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(.028, when + .006);
    g.gain.exponentialRampToValueAtTime(.0001, when + .09);
    src.connect(hp); hp.connect(g); g.connect(a.master);
    src.start(when);
    src.stop(when + .12);
  }

  // 24 秒「穿门」处：空灵 → 明亮，参数渐变
  function switchStyle(a, bright) {
    a.styleB = bright;
    const now = a.ac.currentTime;
    a.padFilter.frequency.setTargetAtTime(bright ? 1650 : 820, now, .9);
    if (a.voices) {
      a.voices.forEach((v, i) => {
        v.g.gain.setTargetAtTime(bright ? .23 : .2, now, .9);
      });
    }
  }

  function startArp(a) {
    if (a.arpTimer) return;
    a.nextNote = a.ac.currentTime + .12;
    a.step = 0;
    a.arpTimer = setInterval(() => {
      if (!a.enabled) return;
      const bright = a.styleB;
      const pattern = bright ? [0, 2, 1, 3, 0, 2, 3, 1] : [0, 1, 2, 3, 2, 1, 0, 2];
      const interval = bright ? .34 : .46;
      const notes = a.chordNotes || chords[0];
      while (a.nextNote < a.ac.currentTime + .35) {
        const idx = pattern[a.step % pattern.length];
        playNote(
          a, midi(notes[idx] + 12), a.nextNote,
          bright ? .072 : .05, bright ? .85 : 1.3,
          bright ? 'triangle' : 'sine',
          bright ? (a.step % 4 < 2 ? -.28 : .28) : (a.step % 2 ? .32 : -.32)
        );
        if (bright) {
          if (a.step % 2 === 0) {
            playNote(a, midi(notes[0] - 12), a.nextNote, .055, .55, 'sine', 0);
          } else {
            playShaker(a, a.nextNote + interval * .5);
          }
        }
        a.nextNote += interval;
        a.step++;
      }
    }, 90);
  }

  function enableMusic() {
    const a = initAudio();
    if (!a) return;
    a.ac.resume();
    a.enabled = true;
    a.master.gain.setTargetAtTime(.55, a.ac.currentTime, .12);
    startArp(a);
    musicBtn.textContent = '音乐：开';
    musicBtn.classList.add('on');
    musicBtn.setAttribute('aria-pressed', 'true');
  }

  function disableMusic() {
    if (!audio) return;
    audio.enabled = false;
    audio.master.gain.setTargetAtTime(0, audio.ac.currentTime, .1);
    if (audio.arpTimer) { clearInterval(audio.arpTimer); audio.arpTimer = null; }
    musicBtn.textContent = '音乐：关';
    musicBtn.classList.remove('on');
    musicBtn.setAttribute('aria-pressed', 'false');
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    let t = now - start;
    let wrapped = false;
    if (t >= LOOP) { start = now; t = 0; wrapped = true; }

    if (audio && audio.enabled) {
      const a = audio;
      const idx = Math.floor(t / 12000) % 4;
      if (idx !== a.chordIndex) setChord(a, idx);
      const bright = t >= 24000;
      if (bright !== a.styleB) switchStyle(a, bright);
      if (wrapped) a.markers.clear();
      for (const m of musicMarkers) {
        if (!a.markers.has(m.t) && t >= m.t) {
          a.markers.add(m.t);
          playChime(a, m.f, a.ac.currentTime + .02, m.t >= 24000);
        }
      }
      const swell = Math.max(
        windowAt(t, 6000, 9000, 14500, 17500),
        windowAt(t, 25500, 28500, 36500, 40000)
      );
      a.noiseGain.gain.setTargetAtTime((bright ? .012 : .02) * swell, a.ac.currentTime, .25);
    }

    pmouse.x += (mouse.x - pmouse.x) * .05;
    pmouse.y += (mouse.y - pmouse.y) * .05;
    const cam = camera(t);

    ctx.save();
    ctx.translate(W / 2 + cam.x, H / 2 + cam.y);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-W / 2, -H / 2);

    drawBackground(t);
    drawStars(t);
    drawClouds(t, dt, 'far');
    drawMeteor(t, 0);
    drawMeteor(t, 5100);
    drawGodRays(t);
    drawLensFlare(t);
    drawLightPath(t);
    drawPortal(t);
    drawBoat(t);
    drawBubbles(t);
    drawParticles(t);
    drawRiver(t);
    drawClouds(t, dt, 'near');
    drawBursts(dt);

    ctx.restore();

    drawChapter(t);

    // 胶片颗粒（屏幕空间）
    if (grainPattern) {
      ctx.save();
      ctx.globalAlpha = .13;
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = grainPattern;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', e => {
    mouse.x = (e.clientX / W - .5) * 2;
    mouse.y = (e.clientY / H - .5) * 2;
  });

  function firstGesture(e) {
    if (gestureDone) return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    gestureDone = true;
    if (!userDisabledMusic) enableMusic();
  }
  window.addEventListener('pointerdown', firstGesture);
  window.addEventListener('keydown', firstGesture);

  canvas.addEventListener('pointerdown', e => spawnBurst(e.clientX, e.clientY));
  document.querySelectorAll('button').forEach(b => {
    b.addEventListener('pointerdown', e => e.stopPropagation());
  });
  musicBtn.addEventListener('click', () => {
    gestureDone = true;
    const a = initAudio();
    if (!a) return;
    if (a.enabled) { userDisabledMusic = true; disableMusic(); }
    else { userDisabledMusic = false; enableMusic(); }
  });

  document.getElementById('replay').addEventListener('click', () => {
    start = performance.now();
    bursts = [];
    if (audio) { audio.markers.clear(); audio.chordIndex = -1; }
    document.querySelectorAll('.kicker,.title,.sub,.tip').forEach(el => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  });

  document.getElementById('fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });

  // 若浏览器允许无交互播放则直接开启，否则等待首次点击
  const autoAudio = initAudio();
  if (autoAudio && autoAudio.ac.state === 'running' && !userDisabledMusic) {
    gestureDone = true;
    enableMusic();
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
